# Static analysis settings for the Flutter app.
#
# On top of the recommended Flutter lints, this turns on the analyzer's strict
# type checks and a set of lint rules that catch real bugs: untyped access to
# JSON, futures that are started and silently dropped, catch blocks that hide
# every kind of error, and code that is harder to read than it needs to be.
# Run `flutter analyze` to check; CI runs it on every push.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Bugs and type safety
    - avoid_dynamic_calls
    - avoid_catches_without_on_clauses
    - cast_nullable_to_non_nullable
    - discarded_futures
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - avoid_void_async
    - no_runtimeType_toString
    # Clearer code
    - avoid_positional_boolean_parameters
    - avoid_redundant_argument_values
    - directives_ordering
    - unnecessary_lambdas
    - unnecessary_null_checks
    - use_named_constants
    - always_declare_return_types
    - type_annotate_public_apis
    # Performance
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_in_for_each
    - use_colored_box
    - use_decorated_box
    - sized_box_shrink_expand
